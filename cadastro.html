<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG Amigos do Bem</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>ONG Amigos do Bem</h1>
        <nav aria-label="Menu principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html" aria-current="page">Cadastro</a>
        </nav>
    </header>
    <main>
        <h2 id="titulo-cadastro">Cadastre-se como Doador ou Voluntário</h2>
        <form action="cadastro.html" method="post" novalidate aria-labelledby="titulo-cadastro">
            <fieldset>
                <legend>Dados Pessoais</legend>
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required minlength="3" maxlength="80">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
                <label for="nascimento">Data de nascimento</label>
                <input type="date" id="nascimento" name="nascimento" required>
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" maxlength="14" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 000.000.000-00">
            </fieldset>
            <fieldset>
                <legend>Endereço</legend>
                <label for="cep">CEP</label>
                <input type="text" id="cep" name="cep" maxlength="9" required pattern="\d{5}-\d{3}" title="Formato: 00000-000">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" required minlength="5">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" name="cidade" required>
                <label for="estado">Estado</label>
                <select id="estado" name="estado" required>
                    <option value="">Selecione</option>
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                </select>
            </fieldset>
            <fieldset>
                <legend>Contato e Colaboração</legend>
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" maxlength="15" required pattern="\(\d{2}\)\s\d{4,5}-\d{4}" title="Formato: (11) 99999-9999">
                <label for="tipo">Tipo de colaboração</label>
                <select id="tipo" name="tipo" required>
                    <option value="">Selecione</option>
                    <option value="doador">Doador</option>
                    <option value="voluntario">Voluntário</option>
                </select>
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="4" placeholder="Conte como deseja ajudar"></textarea>
            </fieldset>
            <button type="submit">Enviar cadastro</button>
        </form>
    </main>
    <footer>
        <p>© 2026 ONG Amigos do Bem. Todos os direitos reservados.</p>
    </footer>
    <script src="js/mascaras.js"></script>
</body>
</html>
